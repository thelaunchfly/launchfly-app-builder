name: launchfly_app
description: The LaunchFly WebView app template (configured per customer at build time).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  url_launcher: ^6.3.1
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  google_mobile_ads: ^5.2.0
  onesignal_flutter: ^5.2.6
  share_plus: ^10.1.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.4
  workmanager: ^0.5.2
  flutter_spinkit: 5.2.1
  lucide_icons: 0.257.0
  flutter_svg: 2.0.10+1
  google_fonts: 6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/app_config.json
    - assets/icon.png
    - assets/icons.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png

flutter_native_splash:
  ios: false
  web: false
  color: "#ffffff"
  image: assets/icon.png
  android_12:
    color: "#ffffff"
    image: assets/icon.png
