name: launchfly_app
description: The LaunchFly WebView app template (configured per customer at build time).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  url_launcher: ^6.3.1
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/app_config.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png

flutter_native_splash:
  ios: false
  web: false
  color: "#ffffff"
  image: assets/icon.png
  android_12:
    color: "#ffffff"
    image: assets/icon.png
